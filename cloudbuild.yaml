# Builds the api and worker images for linux/amd64 (Cloud Run's platform) in parallel and pushes them.
# scripts/build-images.sh runs it, so a laptop needs neither QEMU nor the disk space.
steps:
  - id: api
    name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    args: ["build", "-f", "apps/api/Dockerfile", "-t", "${_REGISTRY}/api:${_TAG}", "."]
    waitFor: ["-"]
  - id: worker
    name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    args: ["build", "-f", "apps/worker/Dockerfile", "-t", "${_REGISTRY}/worker:${_TAG}", "."]
    waitFor: ["-"]
images:
  - "${_REGISTRY}/api:${_TAG}"
  - "${_REGISTRY}/worker:${_TAG}"
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
