server {
  listen 80;
  root /usr/share/nginx/html;

  # Same-origin API calls, so the browser needs no CORS and no API host baked into the bundle.
  # The prefix is needed because /documents/:id is both a page and an API route; the trailing slashes strip it.
  location /api/ {
    proxy_pass http://api:3000/;
    # The api's own cap: a 10 MB PDF plus the multipart framing.
    client_max_body_size 11m;
  }

  location / {
    try_files $uri /index.html;
  }
}
